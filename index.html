<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Flutter Web will set viewport automatically -->
  <meta name="description" content="HTCL Technologies Employee Management App">
  <meta name="theme-color" content="#2563EB">

  <!-- Security Headers -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(), camera=()">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTCL Employee">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <title>HTCL Technologies - Employee Management</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to API domain if using external APIs -->
  <link rel="preconnect" href="https://api.example.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.example.com">

  <!-- Fonts preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
  <noscript>
    This app requires JavaScript to be enabled.
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
