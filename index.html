<!DOCTYPE html>
<html>

<head>
  <base href="https://htcl-employees-iw1bc1any-htcl-s-projects.vercel.app">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HTCL Technologies Employee Management App">
  <meta name="theme-color" content="#2563EB">

  <!-- Security Headers -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(), camera=()">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTCL Employee">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <title>HTCL Technologies - Employee Management</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fonts preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* 1. Reset and Full Height Setup */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Prevents scrollbars during loading */
      background: #0f172a;
      font-family: "Inter", sans-serif;
      /* Ensure font is loaded */
    }

    /* 2. The Full Screen Wrapper */
    .loader-wrapper {
      position: fixed;
      inset: 0;
      /* Top, Right, Bottom, Left = 0 */
      display: flex;
      align-items: center;
      /* Vertical Center */
      justify-content: center;
      /* Horizontal Center */
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      z-index: 999999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* 3. The Content Container */
    .loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      /* Stack text above spinner if needed, or row */
      align-items: center;
      justify-content: center;
      width: 200px;
      height: 200px;
    }

    /* 4. The Rotating Spinner (Planet/Ring) */
    .loader {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: loader-rotate 3s linear infinite;
      z-index: 1;
      /* Using a subtle gradient border effect */
      background: transparent;
      box-shadow:
        inset 0 0 20px rgba(255, 255, 255, 0.05),
        0 0 15px rgba(37, 99, 235, 0.2);
    }

    /* The glowing ring inside */
    .loader::after {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #3b82f6;
      /* Blue accent */
      border-right-color: #60a5fa;
      animation: loader-spin-fast 1.5s linear infinite;
    }

    /* 5. The Text "LAUNCHING" */
    .text-container {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 2px;
    }

    .loader-letter {
      display: inline-block;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0.3;
      animation: letter-glow 2s infinite ease-in-out;
    }

    /* Staggered animation delays for the wave effect */
    .loader-letter:nth-child(1) {
      animation-delay: 0.0s;
    }

    .loader-letter:nth-child(2) {
      animation-delay: 0.1s;
    }

    .loader-letter:nth-child(3) {
      animation-delay: 0.2s;
    }

    .loader-letter:nth-child(4) {
      animation-delay: 0.3s;
    }

    .loader-letter:nth-child(5) {
      animation-delay: 0.4s;
    }

    .loader-letter:nth-child(6) {
      animation-delay: 0.5s;
    }

    .loader-letter:nth-child(7) {
      animation-delay: 0.6s;
    }

    .loader-letter:nth-child(8) {
      animation-delay: 0.7s;
    }

    .loader-letter:nth-child(9) {
      animation-delay: 0.8s;
    }

    /* 6. Background Stars */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 3s infinite ease-in-out;
      box-shadow: 0 0 4px #fff;
    }

    /* Random positioning for stars */
    .star:nth-child(1) {
      top: 20%;
      left: 20%;
      animation-delay: 0s;
    }

    .star:nth-child(2) {
      top: 70%;
      left: 80%;
      animation-delay: 1s;
    }

    .star:nth-child(3) {
      top: 30%;
      left: 80%;
      animation-delay: 2s;
    }

    .star:nth-child(4) {
      top: 80%;
      left: 30%;
      animation-delay: 0.5s;
    }

    .star:nth-child(5) {
      top: 10%;
      left: 50%;
      animation-delay: 1.5s;
    }

    /* --- Animations --- */

    @keyframes loader-rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes loader-spin-fast {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes letter-glow {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
        filter: blur(0px);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
        filter: blur(0.5px);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      }
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.5);
      }
    }
  </style>
</head>

<body>
  <noscript>
    This app requires JavaScript to be enabled.
  </noscript>

  <!-- APP LOADER -->
  <div id="loader-wrapper" class="loader-wrapper">
    <div class="loader-container">

      <!-- Background Stars -->
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>

      <!-- The Spinner Ring -->
      <div class="loader"></div>

      <!-- The Text -->
      <div class="text-container">
        <span class="loader-letter">L</span>
        <span class="loader-letter">A</span>
        <span class="loader-letter">U</span>
        <span class="loader-letter">N</span>
        <span class="loader-letter">C</span>
        <span class="loader-letter">H</span>
        <span class="loader-letter">I</span>
        <span class="loader-letter">N</span>
        <span class="loader-letter">G</span>
      </div>

    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loader-wrapper');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden'; // Ensures it's not clickable after fade out

        setTimeout(() => {
          loader.remove();
          // Restore scrolling if your app needs it after load
          document.body.style.overflow = 'auto';
        }, 500);
      }
    });
  </script>
</body>

</html>
